services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: autoblog
      POSTGRES_PASSWORD: autoblog
      POSTGRES_DB: autoblog
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U autoblog -d autoblog"]
      interval: 2s
      timeout: 5s
      retries: 10
    volumes:
      - autoblog_pgdata:/var/lib/postgresql/data
volumes:
  autoblog_pgdata:
